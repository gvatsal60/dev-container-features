name: "DevContainer Features - Test"
permissions:
  contents: read
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      on_changes_only:
        type: boolean
        description: "on_changes_only"
        default: false
      enabled:
        type: boolean
        description: "enabled"
        default: true
  schedule:
    # every day at 01:00
    - cron: "0 1 * * *"
  pull_request:
  push:
    branches:
      - master
jobs:
  test-scenarios:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features: ["pre-commit", "sonarlint", "uv"]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli
      - name: "Testing '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated  .
  test-global:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli
      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
