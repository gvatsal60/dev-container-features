name: "DevContainer Features - Test"
permissions:
  contents: read
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      on_changes_only:
        type: boolean
        description: "on_changes_only"
        default: false
      enabled:
        type: boolean
        description: "enabled"
        default: true
  schedule:
    # every day at 01:00
    - cron: "0 1 * * *"
  pull_request:
  push:
    branches:
      - master
jobs:
  test-scenarios:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features: ["pre-commit", "sonarlint", "uv", "hermes-agent", "kilo-cli", "kiro-cli"]
        baseImage: ["ubuntu:focal", "ubuntu:jammy", "debian:11", "debian:12", "mcr.microsoft.com/devcontainers/base:ubuntu", "mcr.microsoft.com/devcontainers/base:debian", "mcr.microsoft.com/devcontainers/base:noble"]
    steps:
      - uses: actions/checkout@v7
      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli
      - name: "Testing '${{ matrix.features }}' scenarios against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-autogenerated -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .
  test-global:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli
      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
