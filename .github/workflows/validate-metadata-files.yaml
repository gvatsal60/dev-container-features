name: "Validate devcontainer-feature.json files"
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Validate devcontainer-feature.json files"
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3
        with:
          validate-only: "true"
          base-path-to-features: "./src"
