name: "DevContainer Features - Release"
permissions:
  contents: write
  packages: write
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  run-tests:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    uses: ./.github/workflows/test.yaml
    secrets: inherit
  deploy:
    needs: [run-tests]
    if: needs.run-tests.result == 'success' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish Features
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
